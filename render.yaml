services:
  - type: web
    name: paint-center-app
    env: node
    plan: free
    buildCommand: "npm run build"
    startCommand: "npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paint-center-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: paint-center-db
    databaseName: paintcenter
    user: paintadmin
    plan: free
